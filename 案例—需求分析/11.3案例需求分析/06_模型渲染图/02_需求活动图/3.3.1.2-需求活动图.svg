l="#000" font-size="20.417" textLength="367.56" font-family="Noto Sans CJK SC">空气输送已开启；目标温度 > 室内温度；</text><text x="727.662" y="410.666" fill="#000" font-size="20.417" textLength="347.286" font-family="Noto Sans CJK SC">高压可用；整车无故障；SOC > 10%。</text><polygon points="517.662,423.838,701.412,423.838,718.912,441.338,701.412,458.838,517.662,458.838,500.162,441.338,517.662,423.838" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="517.662" y="450.239" fill="#000" font-size="20.417" textLength="183.749" font-family="Noto Sans CJK SC">全部使能条件满足？</text><text x="479.746" y="435.458" fill="#000" font-size="20.417" font-family="Noto Sans CJK SC">是</text><text x="718.912" y="435.458" fill="#000" font-size="20.417" font-family="Noto Sans CJK SC">否</text><rect x="399.538" y="473.421" width="172.083" height="58.73" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="414.121" y="511.687" fill="#000" font-size="20.417" textLength="142.916" font-family="Noto Sans CJK SC">允许电加热输出</text><rect x="602.619" y="473.421" width="261.752" height="58.73" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="617.202" y="511.687" fill="#000" font-size="20.417" textLength="232.586" font-family="Noto Sans CJK SC">禁止/保持关闭电加热输出</text><polygon points="609.537,540.901,627.037,558.401,609.537,575.901,592.037,558.401,609.537,540.901" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="23.333" y="607.984" width="1177.658" height="444.254" fill="none" style="stroke:#000;stroke-width:2.188;" rx="7.292" ry="7.292"/><path d="M323.749,607.984 L323.749,627.339 L309.165,641.922 L23.333,641.922" style="stroke:#000;stroke-width:2.188;" fill="none"/><text x="27.708" y="633.126" fill="#000" font-size="20.417" textLength="285.832" font-family="Noto Sans CJK SC">监测电加热温度并执行过温保护</text><path d="M759.745,656.506 L759.745,759.779 L1183.491,759.779 L1183.491,671.089 L1168.908,656.506 L759.745,656.506" style="stroke:#C9AD66;stroke-width:0.729;" fill="#FFF5D6"/><path d="M1168.908,656.506 L1168.908,671.089 L1183.491,671.089 L1168.908,656.506" style="stroke:#C9AD66;stroke-width:0.729;" fill="#FFF5D6"/><text x="768.495" y="687.481" fill="#000" font-size="20.417" textLength="253.002" font-family="Noto Sans CJK SC">温度上限/恢复阈值待标定；</text><text x="768.495" y="717.044" fill="#000" font-size="20.417" textLength="393.121" font-family="Noto Sans CJK SC">电加热温度按50 ms检测（SL29 4.6.3.5）。</text><text x="768.495" y="746.607" fill="#000" font-size="20.417" textLength="285.832" font-family="Noto Sans CJK SC">持续监测，不表示只检测一次。</text><polygon points="476.829,759.779,742.245,759.779,759.745,777.279,742.245,794.779,476.829,794.779,459.329,777.279,476.829,759.779" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="476.829" y="786.18" fill="#000" font-size="20.417" textLength="265.416" font-family="Noto Sans CJK SC">已触发且尚未解除过温保护？</text><text x="438.913" y="771.399" fill="#000" font-size="20.417" font-family="Noto Sans CJK SC">是</text><text x="759.745" y="771.399" fill="#000" font-size="20.417" font-family="Noto Sans CJK SC">否</text><polygon points="214.463,809.362,403.868,809.362,421.368,826.862,403.868,844.362,214.463,844.362,196.963,826.862,214.463,809.362" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="214.463" y="835.764" fill="#000" font-size="20.417" textLength="189.405" font-family="Noto Sans CJK SC">温度 &lt;= 恢复XXX℃？</text><text x="176.547" y="820.982" fill="#000" font-size="20.417" font-family="Noto Sans CJK SC">是</text><text x="421.368" y="820.982" fill="#000" font-size="20.417" font-family="Noto Sans CJK SC">否</text><rect x="40.833" y="858.945" width="274.166" height="88.293" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="55.417" y="897.212" fill="#000" fon
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1146px;height:1022px;background:#FFFFFF;" width="1146.25px" height="1022.292px" viewBox="0 0 1146 1022" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="385.219" y="52.85" fill="#000" font-size="20.417" textLength="373.848" font-weight="700" font-family="Noto Sans CJK SC">3.3.1.9 前后风窗除霜/除雾 — 需求活动图</text></g><ellipse cx="580.893" cy="96.647" rx="14.583" ry="14.583" fill="#222" style="stroke:#222;stroke-width:1.458;"/><rect x="454.018" y="140.397" width="253.749" height="58.73" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="468.602" y="178.663" fill="#000" font-size="20.417" textLength="224.582" font-family="Noto Sans CJK SC">接收风窗除霜或除雾请求</text><rect x="413.185" y="228.293" width="335.415" height="58.73" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="427.769" y="266.56" fill="#000" font-size="20.417" textLength="306.249" font-family="Noto Sans CJK SC">识别前除霜、前除雾或后风窗请求</text><polygon points="444.184,317.362,717.602,317.362,735.102,334.862,717.602,352.362,444.184,352.362,426.684,334.862,444.184,317.362" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="444.184" y="343.764" fill="#000" font-size="20.417" textLength="273.419" font-family="Noto Sans CJK SC">有依据的前除霜/前除雾请求？</text><text x="406.267" y="328.982" fill="#000" font-size="20.417" font-family="Noto Sans CJK SC">是</text><text x="735.102" y="328.982" fill="#000" font-size="20.417" textLength="163.333" font-family="Noto Sans CJK SC">后风窗等缺少依据</text><path d="M326.666,366.945 L326.666,397.967 L297.499,403.8 L326.666,409.633 L326.666,440.655 A0,0 0 0 0 326.666,440.655 L643.123,440.655 A0,0 0 0 0 643.123,440.655 L643.123,381.529 L628.539,366.945 L326.666,366.945 A0,0 0 0 0 326.666,366.945" style="stroke:#C9AD66;stroke-width:0.729;" fill="#FFF5D6"/><path d="M628.539,366.945 L628.539,381.529 L643.123,381.529 L628.539,366.945" style="stroke:#C9AD66;stroke-width:0.729;" fill="#FFF5D6"/><text x="335.416" y="397.92" fill="#000" font-size="20.417" textLength="285.832" font-family="Noto Sans CJK SC">对应风口、最大风量、外循环；</text><text x="335.416" y="427.483" fill="#000" font-size="20.417" textLength="266.048" font-family="Noto Sans CJK SC">外循环90%待定；温度保持。</text><rect x="23.333" y="374.435" width="274.166" height="58.73" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="37.917" y="412.702" fill="#000" font-size="20.417" textLength="244.999" font-family="Noto Sans CJK SC">配置风口、风量与循环状态</text><path d="M308.76,469.822 L308.76,515.625 L279.594,521.458 L308.76,527.292 L308.76,573.095 A0,0 0 0 0 308.76,573.095 L855.537,573.095 A0,0 0 0 0 855.537,573.095 L855.537,484.405 L840.953,469.822 L308.76,469.822 A0,0 0 0 0 308.76,469.822" style="stroke:#C9AD66;stroke-width:0.729;" fill="#FFF5D6"/><path d="M840.953,469.822 L840.953,484.405 L855.537,484.405 L840.953,469.822" style="stroke:#C9AD66;stroke-width:0.729;" fill="#FFF5D6"/><text x="317.51" y="500.797" fill="#000" font-size="20.417" textLength="516.152" font-family="Noto Sans CJK SC">环境温度决定AC请求；除湿转速最低1000 r/min待标定。</text><text x="317.51" y="530.36" fill="#000" font-size="20.417" textLength="485.159" font-family="Noto Sans CJK SC">SL29优先级/低SOC许可按其适用条件，XX阈值未定；</text><text x="317.51" y="559.923" fill="#000" font-size="20.417" textLength="288.078" font-family="Noto Sans CJK SC">不把场景二35℃移作仲裁门限。</text><rect x="41.239" y="492.093" width="238.355" height="58.73" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="55.822" y="530.36" fill="#000" font-size="20.417" textLength="209.188" font-family="Noto Sans CJK SC">确定AC与制冷能力请求</text><rect x="53.958" y="602.261" width="212.916" height="58.73" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="68.542" y="640.528" fill="#000" font-size="20.417" textLength="183.749" font-family="Noto Sans CJK SC">实施热量与空气调节</text><rect x="53.958" y="690.158" width="212.916" height="58.73" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="68.542" y="728.424" fill="#000" font-size="20.417" textLength="183.749" font-family="Noto Sans CJK SC">反馈模式与空调状态</text><rect x="884.703" y="366.945" width="233.332" height="88.293" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="899.287" y="405.212" fill="#000" font-size="20.417" textLength="183.749" font-family="Noto Sans CJK SC">停留在待确认处理；</text><text x="899.287" y="434.775" fill="#000" font-size="20.417" textLength="204.166" font-family="Noto Sans CJK SC">不套用前风窗控制配置</text><polygon points="580.893,757.638,598.393,775.138,580.893,792.638,563.393,775.138,580.893,757.638" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="580.893" cy="837.846" rx="16.042" ry="16.042" fill="none" style="stroke:#222;stroke-width:1.458;"/><ellipse cx="580.893" cy="837.846" rx="8.75" ry="8.75" fill="#222" style="stroke:#222;stroke-width:1.458;"/><line x1="580.893" y1="111.23" x2="580.893" y2="140.397" style="stroke:#35566C;stroke-width:1.458;"/><polygon points="575.06,125.813,580.893,140.397,586.726,125.813,580.893,131.647" fill="#35566C" style="stroke:#35566C;stroke-width:1.458;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="580.893" y1="199.126" x2="580.893" y2="228.293" style="stroke:#35566C;stroke-width:1.458;"/><polygon points="575.06,213.71,580.893,228.293,586.726,213.71,580.893,219.543" fill="#35566C" style="stroke:#35566C;stroke-width:1.458;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="160.416" y1="433.165" x2="160.416" y2="492.093" style="stroke:#35566C;stroke-width:1.458;"/><poly
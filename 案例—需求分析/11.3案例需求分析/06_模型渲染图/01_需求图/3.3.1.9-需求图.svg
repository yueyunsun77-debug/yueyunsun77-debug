ck</text><line x1="348.542" y1="173.669" x2="803.102" y2="173.669" style="stroke:#496C84;stroke-width:0.729;"/><text x="355.833" y="203.186" fill="#000" font-size="20.417" textLength="439.977" font-family="Noto Sans CJK SC">Text = CCU经CAN接收IVI发出的前除霜/前除雾请</text><text x="355.833" y="232.749" fill="#000" font-size="20.417" textLength="187.036" font-family="Noto Sans CJK SC">求，并向IVI反馈状态</text></g><!--class R1--><g class="entity" data-qualified-name="R1" id="ent0004" data-source-line="29"><rect x="317.917" y="287.688" width="516.767" height="174.066" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="506.771" y="318.663" fill="#000" font-size="20.417" textLength="139.057" font-style="italic" font-family="Noto Sans CJK SC">«requirement»</text><text x="530.251" y="348.226" fill="#000" font-size="20.417" textLength="92.099" font-family="Noto Sans CJK SC">3.3.1.9-02</text><text x="452.208" y="377.79" fill="#000" font-size="20.417" textLength="248.184" font-family="Noto Sans CJK SC">frontDefrostConfiguration</text><line x1="319.375" y1="390.961" x2="833.225" y2="390.961" style="stroke:#496C84;stroke-width:0.729;"/><text x="326.667" y="420.478" fill="#000" font-size="20.417" textLength="499.267" font-family="Noto Sans CJK SC">Text = 前除霜/除雾位置、最大风量、外循环90%待定；</text><text x="326.667" y="450.041" fill="#000" font-size="20.417" textLength="81.666" font-family="Noto Sans CJK SC">温度保持</text></g><!--class R2--><g class="entity" data-qualified-name="R2" id="ent0006" data-source-line="33"><rect x="329.583" y="504.98" width="492.737" height="144.503" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="506.423" y="535.955" fill="#000" font-size="20.417" textLength="139.057" font-style="italic" font-family="Noto Sans CJK SC">«requirement»</text><text x="529.902" y="565.518" fill="#000" font-size="20.417" textLength="92.099" font-family="Noto Sans CJK SC">3.3.1.9-03</text><text x="458.536" y="595.081" fill="#000" fo
 x1="277.083" y1="173.669" x2="823.131" y2="173.669" style="stroke:#496C84;stroke-width:0.729;"/><text x="284.375" y="203.186" fill="#000" font-size="20.417" textLength="531.464" font-family="Noto Sans CJK SC">Text = 接收用户制热请求与目标温度；物理输入路径待确认</text></g><!--class R1--><g class="entity" data-qualified-name="R1" id="ent0004" data-source-line="29"><rect x="306.25" y="258.522" width="487.714" height="144.503" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="480.578" y="289.496" fill="#000" font-size="20.417" textLength="139.057" font-style="italic" font-family="Noto Sans CJK SC">«requirement»</text><text x="504.057" y="319.06" fill="#000" font-size="20.417" textLength="92.099" font-family="Noto Sans CJK SC">3.3.1.2-02</text><text x="411.458" y="348.623" fill="#000" font-size="20.417" textLength="277.298" font-family="Noto Sans CJK SC">environmentLoadAdaptation</text><line x1="307.708" y1="361.794" x2="792.506" y2="361.794" style="stroke:#496C84;stroke-width:0.729;"/><text x="315" y="391.311" fill="#000" font-size="20.417" textLength="470.214" font-family="Noto Sans CJK SC">Text = 环境温度与电池热负荷对输出优化方式待明确</text></g><!--class R2--><g class="entity" data-qualified-name="R2" id="ent0006" data-source-line="33"><rect x="275.625" y="446.647" width="548.964" height="174.066" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="480.578" y="477.621" fill="#000" font-size="20.417" textLength="139.057" font-style="italic" font-family="Noto Sans CJK SC">«requirement»</text><text x="504.057" y="507.185" fill="#000" font-size="20.417" textLength="92.099" font-family="Noto Sans CJK SC">3.3.1.2-03</text><text x="449.964" y="536.748" fill="#000" font-size="20.417" textLength="200.287" font-family="Noto Sans CJK SC">ptcEnableConditions</text><line x1="277.083" y1="549.919" x2="823.131" y2="549.919" style="stroke:#496C84;stroke-width:0.729;"/><text x="284.375" y="579.436" fill="#000" font-size="20.417" textLength="531.464" font-family="Noto Sans CJK SC">Text = 空气输送开启、目标温度高于室内、高压可用、整车</text><text x="284.375" y="608.999" fill="#000" font-size="20.417" textLength="358.556" font-family="Noto Sans CJK SC">无故障、SOC>10%全部满足后允许加热</text></g><!--class R3--><g class="entity" data-qualified-name="R3" id="ent0008" data-source-line="37"><rect x="275.625" y="663.938" width="548.964" height="144.503" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="480.578" y="694.913" fill="#000" font-size="20.417" textLength="139.057" font-style="italic" font-family="Noto Sans CJK SC">«requirement»</text><text x="504.057" y="724.476" fill="#000" font-size="20.417" textLength="92.099" font-family="Noto Sans CJK SC">3.3.1.2-04</text><text x="472.8" y="754.04" fill="#000" font-size="20.417" textLength="154.615" font-family="Noto Sans CJK SC">ptcRelayControl</text><line x1="277.083" y1="767.211" x2="823.131" y2="767.211" style="stroke:#496C84;stroke-width:0.729;"/><text x="284.375" y="796.728" fill="#000" font-size="20.417" textLength="531.464" font-family="Noto Sans CJK SC">Text = 按使能条件控制电加热通断；不设计具体继电器硬件</text></g><!--class R4--><g class="entity" data-qualified-name="R4" id="ent0010" data-source-line="41"><rect x="319.375" y="852.063" width="460.315" height="174.066" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="480.004" y="883.038" fill="#000" font-size="20.417" textLength="139.057" font-style="italic" font-family="Noto Sans CJK SC">«requirement»</text><text x="503.483" y="912.601" fill="#000" font-size="20.417" textLength="92.099" font-family="Noto Sans CJK SC">3.3.1.2-05</text><text x="400.941" y="942.165" fill="#000" font-size="20.417" textLength="297.184" font-family="Noto Sans CJK SC">ptcOvertemperatureProtection</text><line x1="320.833" y1="955.336" x2="778.232" y2="955.336" style="stroke:#496C84;stroke-width:0.729;"/><text x="328.125" y="984.853" fill="#000" font-size="20.417" textLength="442.815" font-family="Noto Sans CJK SC">Text = 温度>=XXX℃停止加热，&lt;=XXX℃允许恢复</text><text x="328.125" y="1014.416" fill="#000" font-size="20.417" textLength="122.499" font-family="Noto Sans CJK SC">；阈值待标定</text></g><!--class R5--><g class="entity" data-qualified-name="R5" id="ent0012" data-source-line="45"><rect x="301.875" y="1069.355" width="495.718" height="144.503" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="480.205" y="1100.33" fill="#000" font-size="20.417" textLength="139.057" font-style="italic" font-family="Noto Sans CJK SC">«requirement»</text><text x="503.684" y="1129.893" fill="#000" font-size="20.417" textLength="92.099" font-family="Noto Sans CJK SC">3.3.1.2-06</text><text x="457.675" y="1159.456" fill="#000" font-size="20.417" textLength="184.117" font-family="Noto Sans CJK SC">ptcStatusFeedback</text><line x1="303.333" y1="1172.628" x2="796.134" y2="1172.628" style="stroke:#496C84;stroke-width:0.729;"/><text x="310.625" y="1202.144" fill="#000" font-size="20.417" textLength="478.218" font-family="Noto Sans CJK SC">Text = 反馈电加热通断、温度、状态及实际/最大功率</text></g><!--class R6--><g class="entity" data-qualified-name="R6" id="ent0014" data-source-line="49"><rect x="301.875" y="1257.48" width="495.718" height="144.503" fill="#EAF3FB" style="stroke:#496C84;stroke-width:0.729;" rx="7.292" ry="7.292"/><text x="480.205" y="1288.455" fill="#000" font-size="20.417" textLength="139.057" font-style="italic" font-family="Noto Sans CJK SC">«requirement»</text><text x="503.684" y="1318.018" fill="#000" font-size="20.417" textLength="92.099" font-family="Noto Sans CJK SC">3.3.1.2-07</text><text x="391.373" y="1347.581" fill="#000" font-size="20.417" textLength="316.722" font-family="Noto Sans CJK SC">cabinOutdoorTemperatureCheck</text><line x1="303.333" y1="1360.753" x2="796.134" y2="1360.753" style="stroke:#496C84;stroke-width:0.729;"/><text x="310.625" y="1390.269" fill="#000" font-size="20.417" textLength="478.218" font-family="Noto Sans CJK SC">Text = 获取室内和室外温度，保留来
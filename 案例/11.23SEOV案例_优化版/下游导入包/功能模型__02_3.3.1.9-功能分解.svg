@startuml
skinparam defaultFontName Noto Sans CJK SC
skinparam defaultFontSize 12
skinparam dpi 120
scale max 2400*12000

skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

comp def "前风窗除霜除雾控制" as E1  <<(T,blue) action  def>>  {
##//doc//##
仅表达功能分解；行为顺序、条件、并行与反馈见行为模型中的同名根模型。
}
comp usage "接收风窗除霜或除雾请求  " as E2  <<(T,blue) action>>  {
}
comp usage "接收风窗除霜除雾请求: F_LF_016  " as E3  <<(T,blue) action>>  {
}
comp usage "配置风窗模式参数  " as E4  <<(T,blue) action>>  {
}

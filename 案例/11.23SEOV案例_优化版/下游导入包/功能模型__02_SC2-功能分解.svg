@startuml
skinparam defaultFontName Noto Sans CJK SC
skinparam defaultFontSize 12
skinparam dpi 120
scale max 2400*12000

skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

comp def "空调供风辅助电池冷却场景" as E1  <<(T,blue) action  def>>  {
##//doc//##
仅表达功能分解；行为顺序、条件、并行与反馈见行为模型中的同名根模型。
}
comp usage "初始化驾驶循环: F_S2_F01  " as E2  <<(T,blue) action>>  {
}
comp usage "记录静置预冷时长: F_S2_F02  " as E3  <<(T,blue) action>>  {
}
comp usage "控制匀速行驶工况: F_S2_F03  " as E4  <<(T,blue) action>>  {
}
comp usage "处理座舱降温请求: F_S2_F04  " as E5  <<(T,blue) action>>  {
}
comp usage "获取电池温度: F_S2_F05  " as E6  <<(T,blue) action>>  {
}
comp usage "判定电池主动冷却需求: F_S2_F06  " as E7  <<(T,blue) action>>  {
}
comp usage "评估环境空气换热量: F_S2_F07  " as E8  <<(T,blue) action>>  {
}
comp usage "协调座舱与电池冷却能力: F_S2_F08  " as E9  <<(T,blue) action>>  {
}
comp usage "评估主动供风响应: F_S2_F09  " as E10  <<(T,blue) action>>  {
}
comp usage "汇总空气侧换热量: F_S2_F10  " as E11  <<(T,blue) action>>  {
}
E1 *- - E2  
E1 *- - E3  
E1 *- - E4  
E1 *- - E5  
E1 *- - E6  
E1 *- - E7  
E1 *- - E8  
E1 *- - E9  
E1 *- - E10  
E1 *- - E11  
@enduml


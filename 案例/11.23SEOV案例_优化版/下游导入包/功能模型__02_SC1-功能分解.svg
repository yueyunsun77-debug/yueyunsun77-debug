@startuml
skinparam defaultFontName Noto Sans CJK SC
skinparam defaultFontSize 12
skinparam dpi 120
scale max 2400*12000

skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

comp def "串联混动经济性场景" as E1  <<(T,blue) action  def>>  {
##//doc//##
仅表达功能分解；行为顺序、条件、并行与反馈见行为模型中的同名根模型。
}
comp usage "接收驾驶指令: F_S1_F01  " as E2  <<(T,blue) action>>  {
}
comp usage "分析动力需求: F_S1_F02  " as E3  <<(T,blue) action>>  {
}
comp usage "选择运行模式: F_S1_F03  " as E4  <<(T,blue) action>>  {
}
comp usage "控制电驱动能量转换: F_S1_F04  " as E5  <<(T,blue) action>>  {
}
comp usage "判定再生制动请求: F_S1_F05  " as E6  <<(T,blue) action>>  {
}
comp usage "协调再生充电: F_S1_F06  " as E7  <<(T,blue) action>>  {
}
comp usage "协调发动机启动: F_S1_F07  " as E8  <<(T,blue) action>>  {
}
comp usage "调节发动机发电工作点: F_S1_F08  " as E9  <<(T,blue) action>>  {
}
comp usage "管理充电能量收支: F_S1_F09  " as E10  <<(T,blue) action>>  {
}
comp usage "更新运行模式评估信息: F_S1_F10  " as E11  <<(T,blue) action>>  {
}
E1 *- - E2  
E1 *- - E3  
E1 *- - E4  
E1 *- - E5  
E1 *- - E6  
E1 *- - E7  
E1 *- - E8  
E1 *- - E9  
E1 *- - E10  
E1 *- - E11  
@enduml


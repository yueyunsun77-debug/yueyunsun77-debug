@startuml
skinparam defaultFontName Noto Sans CJK SC
skinparam defaultFontSize 12
skinparam dpi 120
scale max 2400*12000

skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

comp def "座舱空调与Chiller电池液冷场景" as E1  <<(T,blue) action  def>>  {
##//doc//##
仅表达功能分解；行为顺序、条件、并行与反馈见行为模型中的同名根模型。
}
comp usage "获取座舱目标温度: F_S3_F01  " as E2  <<(T,blue) action>>  {
}
comp usage "获取座舱实际温度: F_S3_F02  " as E3  <<(T,blue) action>>  {
}
comp usage "判定座舱制冷需求: F_S3_F03  " as E4  <<(T,blue) action>>  {
}
comp usage "调节座舱制冷能力: F_S3_F04  " as E5  <<(T,blue) action>>  {
}
comp usage "调节座舱送风量: F_S3_F05  " as E6  <<(T,blue) action>>  {
}
comp usage "获取电池温度与功率: F_S3_F06  " as E7  <<(T,blue) action>>  {
}
comp usage "判定电池辅助冷却需求: F_S3_F07  " as E8  <<(T,blue) action>>  {
}
comp usage "计算电池冷却能力需求: F_S3_F08  " as E9  <<(T,blue) action>>  {
}
comp usage "分配座舱与电池制冷能力: F_S3_F09  " as E10  <<(T,blue) action>>  {
}
comp usage "调节电池液路换热量: F_S3_F10  " as E11  <<(T,blue) action>>  {
}
comp usage "反馈座舱与电池冷却状态: F_S3_F11  " as E12  <<(T,blue) action>>  {
}
E1 *- - E2  
E1 *- - E3  
E1 *- - E4  
E1 *- - E5  
E1 *- - E6  
E1 *- - E7  
E1 *- - E8  
E1 *- - E9  
E1 *- - E10  
E1 *- - E11  
E1 *- - E12  
@enduml


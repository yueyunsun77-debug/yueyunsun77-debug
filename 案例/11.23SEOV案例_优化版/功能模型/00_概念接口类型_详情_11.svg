##//doc//##
循环请求；角色：请求<U+002F>命令；单位：来源未提供或不适用。
}
comp def "C083" as E3  <<(T,blue) item  def>>  {
##//doc//##
恢复加热许可；角色：分析数据；单位：来源未提供或不适用。
}
comp def "C084" as E4  <<(T,blue) item  def>>  {
##//doc//##
恢复许可；角色：分析数据；单位：来源未提供或不适用。
}
